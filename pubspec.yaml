name: fruits_hub
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dots_indicator: ^4.0.1
  easy_localization: ^3.0.7+1
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.2
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  modal_progress_hud_nsn: ^0.5.1
  google_sign_in: ^6.3.0
  flutter_facebook_auth: ^7.1.1
  cloud_firestore: ^5.6.6
  flutter_svg_provider: ^1.0.7
dev_dependencies:
  
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/
    - assets/translations/
  fonts:
    - family: "Cairo"
      fonts:
        - asset: assets/fonts/cario/Cairo-Regular.ttf
        - asset: assets/fonts/cario/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cario/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cario/Cairo-Bold.ttf
          weight: 700
