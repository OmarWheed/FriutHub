name: fruits_hub
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  cupertino_icons: ^1.0.8
  dots_indicator: ^4.0.1
  easy_localization: ^3.0.7+1
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/
    - assets/translations/
  fonts:
    - family: "Cairo"
      fonts:
        - asset: assets/fonts/cario/Cairo-Regular.ttf
        - asset: assets/fonts/cario/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cario/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cario/Cairo-Bold.ttf
          weight: 700
